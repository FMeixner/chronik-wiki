<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Nachschlagewerk unserer Splittermond-Runde — destilliert aus der Chronik.">
<meta name="theme-color" content="#11131f">
<title>Chronik-Wiki</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2311131f'/%3E%3Cpath d='M32 10a22 22 0 0 0 0 44l-3-14 6-9-5-9z' fill='%23d5dceb'/%3E%3Cpath d='M36 11l5 10-6 9 4 13-3 10a22 22 0 0 0 0-42z' fill='%237fd1c7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,50;1,9..144,400..600,50&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Splitterlicht — Designsystem
   Nachthimmel (Indigo), Mondsilber, Splitterlicht (Türkis),
   Blutgras (Rot) nur für Verlust/Tod, Glut für „unklar“.
   ============================================================ */
:root {
  --night: #11131f;
  --night-2: #161929;
  --night-3: #1d2135;
  --night-4: #262b44;
  --line: #2b3050;
  --line-soft: #20243b;
  --text: #e5e2d8;
  --text-2: #c3c1ba;
  --muted: #9396ad;
  --faint: #6c6f88;
  --moon: #d5dceb;
  --shard: #7fd1c7;
  --shard-hi: #a8e6de;
  --shard-dim: rgba(127, 209, 199, .14);
  --blood: #d0675c;
  --ember: #d9a85f;
  --grass: #8fbf86;

  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;

  --side: 288px;
  --measure: 68ch;
  --r-s: 6px;
  --r-m: 12px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 24px; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--night);
  color: var(--text);
  font: 400 17px/1.62 var(--body);
  font-feature-settings: "kern", "liga";
  /* zarter Sternenstaub ohne Bilddatei */
  background-image:
    radial-gradient(1px 1px at 12% 18%, rgba(213,220,235,.35) 50%, transparent 51%),
    radial-gradient(1px 1px at 68% 8%, rgba(213,220,235,.25) 50%, transparent 51%),
    radial-gradient(1px 1px at 84% 42%, rgba(127,209,199,.3) 50%, transparent 51%),
    radial-gradient(1px 1px at 36% 76%, rgba(213,220,235,.2) 50%, transparent 51%),
    radial-gradient(1200px 600px at 100% -10%, rgba(127,209,199,.06), transparent 60%);
  background-attachment: fixed;
}
::selection { background: rgba(127,209,199,.3); color: #fff; }

a { color: var(--shard); text-decoration: underline; text-decoration-color: rgba(127,209,199,.35); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--shard-hi); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--shard); outline-offset: 2px; border-radius: 4px; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Gerüst ---------- */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--side);
  background: rgba(17,19,31,.92);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column;
  z-index: 40;
}
.main { margin-left: var(--side); min-height: 100vh; }
.content { max-width: 1180px; margin: 0 auto; padding: 56px 56px 96px; }

/* ---------- Marke ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; text-decoration: none; color: inherit; }
.brand:hover { color: inherit; }
.brand-moon { flex: 0 0 auto; }
.brand-name { font-family: var(--display); font-size: 25px; font-weight: 600; line-height: 1; color: var(--moon); font-variation-settings: "opsz" 72; }
.brand-sub { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }

/* ---------- Suche ---------- */
.search-wrap { position: relative; padding: 0 16px 12px; }
.search-box { position: relative; }
#search {
  width: 100%; height: 40px;
  background: var(--night-2); color: var(--text);
  border: 1px solid var(--line); border-radius: var(--r-s);
  padding: 0 44px 0 36px;
  font: 400 15px var(--body);
  transition: border-color .15s, background .15s;
}
#search::placeholder { color: var(--faint); }
#search:focus { outline: none; border-color: var(--shard); background: var(--night-3); }
.search-icon { position: absolute; left: 12px; top: 12px; color: var(--faint); pointer-events: none; }
.kbd { position: absolute; right: 9px; top: 9px; font: 700 11px/20px var(--body); color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; pointer-events: none; }
#search:focus ~ .kbd { display: none; }
#search-results {
  position: absolute; top: 46px; left: 16px; right: -260px; z-index: 60;
  background: var(--night-3); border: 1px solid var(--line); border-radius: var(--r-m);
  box-shadow: 0 24px 60px rgba(4,5,12,.6);
  max-height: 70vh; overflow-y: auto; display: none;
}
#search-results.open { display: block; }
.sr-item { display: block; padding: 11px 16px; border-bottom: 1px solid var(--line-soft); color: var(--text); text-decoration: none; }
.sr-item:last-child { border-bottom: 0; }
.sr-item:hover, .sr-item.sel { background: var(--night-4); color: var(--text); }
.sr-title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; }
.sr-type { margin-left: auto; font-size: 12.5px; font-weight: 400; color: var(--faint); }
.sr-title .type-ic { color: var(--shard); flex: 0 0 auto; }
.sr-snippet { margin-top: 3px; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.sr-snippet mark { background: var(--shard-dim); color: var(--shard-hi); padding: 0 2px; border-radius: 2px; }
.sr-empty { padding: 14px 16px; color: var(--muted); font-size: 14px; }

/* ---------- Navigation ---------- */
nav.wikinav { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0 28px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.nav-top { padding: 0 10px 8px; border-bottom: 1px solid var(--line-soft); margin-bottom: 8px; }
.navgroup { padding: 0 10px; }
.navgroup > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: var(--r-s);
  font-family: var(--display); font-size: 15.5px; font-weight: 600; color: var(--text-2);
}
.navgroup > summary::-webkit-details-marker { display: none; }
.navgroup > summary:hover { background: rgba(255,255,255,.03); color: var(--text); }
.navgroup > summary .count { margin-left: auto; font: 400 12.5px var(--body); color: var(--faint); }
.navgroup > summary .chev { color: var(--faint); transition: transform .15s; }
.navgroup[open] > summary .chev { transform: rotate(90deg); }
.navgroup ul { list-style: none; margin: 2px 0 8px; padding: 0 0 0 8px; }
.navitem {
  display: flex; align-items: center; gap: 9px;
  padding: 4px 10px; border-radius: var(--r-s);
  color: var(--muted); font-size: 14.5px; text-decoration: none; line-height: 1.4;
}
.navitem:hover { color: var(--text); background: rgba(255,255,255,.03); }
.navitem.active { color: var(--moon); background: var(--shard-dim); }
.navitem .type-ic { flex: 0 0 auto; opacity: .7; }
.navitem.active .type-ic { color: var(--shard); opacity: 1; }
.navitem .lost { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--blood); flex: 0 0 auto; }
.nav-top .navitem { font-size: 15px; color: var(--text-2); padding: 6px 10px; }

/* ---------- Seitenkopf ---------- */
.page-head { max-width: var(--measure); margin-bottom: 34px; }
.crumb { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
.crumb .type-ic { color: var(--shard); }
h1.page-title {
  font-family: var(--display); font-weight: 600;
  font-size: clamp(34px, 4.6vw, 52px); line-height: 1.06; letter-spacing: -.01em;
  margin: 10px 0 0; color: var(--moon);
  font-variation-settings: "opsz" 144, "SOFT" 50;
}
.kurz { margin: 16px 0 0; font-family: var(--display); font-size: 21px; line-height: 1.45; font-style: italic; color: var(--text-2); font-variation-settings: "opsz" 24; }

/* Layout mit Steckbrief rechts */
.page-grid { display: grid; grid-template-columns: minmax(0, var(--measure)) 280px; gap: 56px; align-items: start; }
.page-grid.solo { grid-template-columns: minmax(0, var(--measure)); }

.steckbrief { position: sticky; top: 28px; font-size: 14.5px; }
.sb-block { padding: 16px 18px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--night-2); }
.sb-block + .sb-block { margin-top: 14px; }
.sb-label { font-family: var(--display); font-size: 14.5px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
.sb-row + .sb-label { margin-top: 14px; }
.sb-status { display: flex; gap: 10px; align-items: flex-start; color: var(--text); line-height: 1.5; }
.dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; margin-top: 7px; background: var(--faint); }
.dot.ok { background: var(--grass); box-shadow: 0 0 0 3px rgba(143,191,134,.15); }
.dot.bad { background: var(--blood); box-shadow: 0 0 0 3px rgba(208,103,92,.15); }
.dot.warn { background: var(--ember); box-shadow: 0 0 0 3px rgba(217,168,95,.15); }
.sb-alias { color: var(--text-2); }
.toc { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
.toc a { display: block; padding: 4px 0 4px 14px; margin-left: -1px; border-left: 2px solid transparent; color: var(--muted); text-decoration: none; line-height: 1.4; font-size: 14px; }
.toc a:hover { color: var(--text); }
.toc a.on { color: var(--shard); border-left-color: var(--shard); }

/* ---------- Artikel ---------- */
.article { min-width: 0; }
.article h2 {
  font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1.2;
  color: var(--moon); margin: 52px 0 14px; font-variation-settings: "opsz" 72;
}
.article h2:first-child { margin-top: 0; }
.article h3 { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--moon); margin: 32px 0 10px; }
.article p { margin: 0 0 16px; }
.article ul, .article ol { margin: 0 0 20px; padding-left: 0; list-style: none; }
.article li { position: relative; padding-left: 24px; margin-bottom: 10px; }
.article ul > li::before {
  content: ""; position: absolute; left: 3px; top: .58em;
  width: 7px; height: 9px; background: var(--shard); opacity: .55;
  clip-path: polygon(50% 0, 100% 40%, 60% 100%, 0 70%);
}
.article ol { counter-reset: n; }
.article ol > li { counter-increment: n; }
.article ol > li::before { content: counter(n) "."; position: absolute; left: 0; color: var(--shard); font-weight: 700; }
.article strong { color: var(--moon); }
.article blockquote { margin: 22px 0; padding: 4px 0 4px 20px; border-left: 2px solid var(--line); color: var(--text-2); font-family: var(--display); font-style: italic; font-size: 18.5px; }
.article hr { border: 0; height: 1px; background: var(--line-soft); margin: 32px 0; }
.article code { background: var(--night-3); border-radius: 4px; padding: 1px 6px; font-size: .88em; color: var(--text-2); }
.article table { border-collapse: collapse; width: 100%; margin: 0 0 20px; font-size: 15px; }
.article th, .article td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line-soft); }
.article th { color: var(--muted); font-weight: 700; }
.sic { font-size: .78em; color: var(--faint); font-style: normal; letter-spacing: .02em; }
.wikilink-missing { color: var(--text-2); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; cursor: help; }


/* Steckbrief der Heldenseiten: vier Felder als Raster */
.sb-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin: 0 0 8px; }
.sb-card { padding: 16px 18px 6px; border-radius: var(--r-m); background: var(--night-2); border: 1px solid var(--line); }
.sb-card h3 { margin: 0 0 10px; font-size: 18px; color: var(--shard-hi); }
.sb-card ul { margin-bottom: 10px; }
.sb-card li { font-size: 15px; line-height: 1.5; margin-bottom: 8px; }
.sb-card > p { font-size: 14px; color: var(--muted); margin: 0 0 8px; }

/* Linklisten der Übersicht */
.link-cloud { display: flex; flex-wrap: wrap; gap: 6px 6px; line-height: 1.3; }
.link-cloud a { display: inline-block; padding: 5px 11px; border-radius: 999px; background: var(--night-2); border: 1px solid var(--line-soft); color: var(--text-2); text-decoration: none; font-size: 14.5px; }
.link-cloud a:hover { border-color: var(--shard); color: var(--shard-hi); }
.link-cloud .sep { display: none; }

/* Callouts */
.callout { border-radius: var(--r-m); padding: 14px 18px; margin: 22px 0; background: rgba(217,168,95,.07); border: 1px solid rgba(217,168,95,.35); }
.callout-title { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ember); margin-bottom: 4px; }
.callout p { margin: 0; color: var(--text-2); font-size: 15.5px; }

/* ---------- Übersicht: Hero ---------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; align-items: center; margin: -8px 0 48px; }
.hero h1 { font-family: var(--display); font-weight: 600; font-size: clamp(44px, 6.4vw, 84px); line-height: .98; letter-spacing: -.02em; margin: 0; color: var(--moon); font-variation-settings: "opsz" 144, "SOFT" 50; }
.hero-lead { margin: 18px 0 0; font-size: 18.5px; color: var(--text-2); max-width: 54ch; }
.hero-stand { margin-top: 22px; display: inline-flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--muted); }
.hero-stand .dot { margin: 0; background: var(--shard); box-shadow: 0 0 0 4px var(--shard-dim); }
.hero-moon { justify-self: end; width: 100%; max-width: 300px; }
.hero-moon .shard { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: no-preference) {
  .hero-moon .drift { animation: drift 9s ease-in-out infinite alternate; }
  .hero-moon .drift.d2 { animation-duration: 12s; animation-delay: -4s; }
  .hero-moon .drift.d3 { animation-duration: 15s; animation-delay: -7s; }
  @keyframes drift { from { transform: translate(0,0) rotate(0); } to { transform: translate(4px,-6px) rotate(6deg); } }
}

.section-title { font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--moon); margin: 0 0 16px; }
.heroes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-bottom: 56px; }
.hero-card {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  padding: 18px 18px 16px; border-radius: var(--r-m);
  background: linear-gradient(160deg, var(--night-3), var(--night-2));
  border: 1px solid var(--line); color: var(--text); text-decoration: none;
  transition: border-color .15s, transform .15s;
}
.hero-card:hover { border-color: var(--shard); color: var(--text); transform: translateY(-2px); }
.hero-card .hc-name { font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--moon); line-height: 1.1; }
.hero-card .hc-kurz { font-size: 14px; color: var(--text-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.hero-card .hc-state { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: auto; padding-top: 6px; }
.hero-card .hc-state .dot { margin: 0; }
.hero-card.fallen { background: var(--night-2); border-style: dashed; }
.hero-card.fallen .hc-name { color: var(--text-2); }

.ov-grid { display: grid; grid-template-columns: minmax(0, var(--measure)) 280px; gap: 56px; align-items: start; }
.quick { display: grid; gap: 10px; }
.quick a { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-m); background: var(--night-2); border: 1px solid var(--line); text-decoration: none; color: var(--text); }
.quick a:hover { border-color: var(--shard); color: var(--text); }
.quick .type-ic { color: var(--shard); }
.quick small { display: block; color: var(--muted); font-size: 13px; }

/* ---------- Timeline ---------- */
.tl-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 26px; }
.tl-filter { flex: 1 1 260px; height: 40px; background: var(--night-2); border: 1px solid var(--line); border-radius: var(--r-s); color: var(--text); padding: 0 14px; font: 15px var(--body); }
.tl-filter:focus { outline: none; border-color: var(--shard); }
.tl-btn { height: 40px; background: transparent; border: 1px solid var(--line); color: var(--text-2); border-radius: var(--r-s); padding: 0 14px; font: 14px var(--body); cursor: pointer; }
.tl-btn:hover { border-color: var(--shard); color: var(--shard-hi); }
.tl-count { font-size: 14px; color: var(--muted); }
.timeline-intro { color: var(--muted); font-size: 15px; margin: 0 0 18px; max-width: var(--measure); }

.tl { position: relative; max-width: 860px; }
.tl::before { content: ""; position: absolute; left: 27px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(180deg, var(--line), var(--shard) 85%, var(--shard)); opacity: .6; }
.session-card { position: relative; padding-left: 70px; margin-bottom: 10px; }
.session-card > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; align-items: baseline; padding: 14px 18px; border-radius: var(--r-m); border: 1px solid transparent; }
.session-card > summary::-webkit-details-marker { display: none; }
.session-card > summary:hover { background: var(--night-2); border-color: var(--line-soft); }
.session-card[open] > summary { background: var(--night-2); border-color: var(--line); border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; }
.session-num {
  position: absolute; left: 6px; top: 12px; width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--night); border: 2px solid var(--line);
  font: 700 15px var(--body); color: var(--text-2); font-variant-numeric: tabular-nums;
}
.session-card[open] .session-num, .session-card.latest .session-num { border-color: var(--shard); color: var(--shard-hi); }
.session-title { font-family: var(--display); font-weight: 600; font-size: 21px; color: var(--moon); margin: 0; line-height: 1.25; }
.session-date { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.session-places { grid-column: 1 / -1; font-size: 14px; color: var(--muted); }
.session-body { padding: 4px 18px 18px; background: var(--night-2); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-m) var(--r-m); }
.session-event { margin: 10px 0 14px; max-width: var(--measure); }
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; margin-top: 8px; }
.chip-label { font-size: 13.5px; color: var(--faint); width: 92px; flex: 0 0 auto; }
.chip { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--night-3); border: 1px solid var(--line-soft); font-size: 13.5px; color: var(--text-2); text-decoration: none; }
a.chip:hover { border-color: var(--shard); color: var(--shard-hi); }
.chip.wikilink-missing { text-decoration: none; }
.session-source { margin-top: 14px; font-size: 13px; color: var(--faint); }
.tl-empty { padding: 24px 0 0 70px; color: var(--muted); }

/* ---------- Backlinks & Fuß ---------- */
.backlinks { max-width: var(--measure); margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line-soft); }
.backlinks h2 { font-family: var(--display); font-size: 19px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }
.page-footer { max-width: var(--measure); margin-top: 28px; font-size: 13.5px; color: var(--faint); }

/* ---------- Zustände ---------- */
.loading { color: var(--muted); font-family: var(--display); font-style: italic; font-size: 20px; padding: 60px 0; }
.error-card { max-width: var(--measure); border: 1px solid rgba(208,103,92,.45); background: rgba(208,103,92,.06); border-radius: var(--r-m); padding: 24px 28px; }
.error-card h2 { font-family: var(--display); color: var(--blood); margin: 0 0 8px; }

#menu-toggle { display: none; position: fixed; top: 12px; left: 12px; z-index: 50; background: var(--night-2); color: var(--moon); border: 1px solid var(--line); border-radius: var(--r-s); width: 44px; height: 44px; cursor: pointer; align-items: center; justify-content: center; }
#nav-backdrop { display: none; position: fixed; inset: 0; background: rgba(5,6,14,.6); z-index: 35; }

/* ---------- Responsiv ---------- */
@media (max-width: 1240px) {
  .page-grid, .ov-grid { grid-template-columns: minmax(0, var(--measure)); gap: 0; }
  .steckbrief { position: static; order: -1; margin-bottom: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .sb-block + .sb-block { margin-top: 0; }
  .sb-toc { display: none; }
  .ov-side { margin-top: 40px; }
}
@media (max-width: 920px) {
  .sidebar { transform: translateX(-100%); transition: transform .22s ease; }
  body.nav-open .sidebar { transform: none; box-shadow: 20px 0 60px rgba(0,0,0,.5); }
  body.nav-open #nav-backdrop { display: block; }
  #menu-toggle { display: flex; }

}
@media (max-width: 560px) {

}

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function () {
  "use strict";

  var MANIFEST_URL = "content/manifest.json";
  var ATLAS_URL = "atlas/index.html";
  var manifest = null;
  var nameIndex = {};   // lowercase Name/Alias -> Seitenobjekt
  var pathIndex = {};   // Pfad -> Seitenobjekt
  var pageCache = {};   // Pfad -> { raw, fm, body }
  var searchReady = false;
  var searchKicking = false;
  var currentEntry = null;
  var tocObserver = null;

  var contentEl = document.getElementById("content");
  var navEl = document.getElementById("wikinav");
  var searchInput = document.getElementById("search");
  var searchResults = document.getElementById("search-results");

  function store(key, val) {
    try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; }
  }

  /* ---------- Icons ---------- */
  function svg(paths, size) {
    return '<svg class="type-ic" width="' + (size || 16) + '" height="' + (size || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + '</svg>';
  }
  var ICONS = {
    uebersicht: svg('<path d="M12 3a9 9 0 1 0 0 18l-1.5-6.5L13 10l-2-5z"/><path d="M14 3.3l2 4.2-2.5 3.6 1.7 5.6-1.2 4"/>'),
    timeline: svg('<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><path d="M6 8v8M11 6h9M11 18h9M11 12h6"/>'),
    atlas: svg('<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>'),
    held: svg('<path d="M12 2.5l2.2 6.3L20.5 11l-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/>'),
    person: svg('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/>'),
    ort: svg('<path d="M12 21s-6.5-5.5-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.5 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/>'),
    artefakt: svg('<path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M7 4l5 16L17 4"/>'),
    fraktion: svg('<path d="M6 3v18M6 4h11l-2.5 3.5L17 11H6"/>'),
    kreatur: svg('<path d="M4 18c2-6 5-9 8-9s6 3 8 9"/><path d="M9 9l-2-5M15 9l2-5"/><circle cx="10" cy="13" r=".6" fill="currentColor"/><circle cx="14" cy="13" r=".6" fill="currentColor"/>'),
    tier: svg('<ellipse cx="12" cy="16" rx="3.4" ry="2.8"/><circle cx="6.6" cy="10.8" r="1.5"/><circle cx="12" cy="9.4" r="1.5"/><circle cx="17.4" cy="10.8" r="1.5"/>'),
    fortschritt: svg('<path d="M7 3h10v18l-5-3-5 3z"/>'),
    chev: '<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    warn: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4L2.5 20h19z"/><path d="M12 10v4M12 17.2v.3"/></svg>'
  };
  var TYPE_LABELS = {
    uebersicht: "Übersicht", timeline: "Timeline", held: "Held", person: "Person",
    ort: "Ort", artefakt: "Artefakt", fraktion: "Fraktion", kreatur: "Kreatur", tier: "Tier", fortschritt: "Arbeitsvermerk"
  };
  var GROUP_LABELS = { held: "Helden", person: "Personen", ort: "Orte", artefakt: "Artefakte", tier: "Tiere", fraktion: "Fraktionen", kreatur: "Kreaturen" };

  /* ---------- Helpers ---------- */
  function escapeHtml(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function encodePath(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function basename(p) { return p.split("/").pop(); }
  function typeKey(p) { return p.held ? "held" : p.type; }
  function slug(s) { return "s-" + String(s).toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9äöüß]+/g, "-").replace(/^-|-$/g, ""); }

  function parseFrontmatter(raw) {
    var fm = { aliases: [] };
    var body = raw;
    var lines = raw.split("\n");
    if (lines[0] && lines[0].trim() === "---") {
      var inFm = true, bodyLines = [];
      for (var i = 1; i < lines.length; i++) {
        if (inFm && lines[i].trim() === "---") { inFm = false; continue; }
        if (inFm) {
          var m = lines[i].match(/^([A-Za-z_]+):\s*(.*)$/);
          if (m) fm[m[1]] = m[2];
        } else bodyLines.push(lines[i]);
      }
      if (!inFm) body = bodyLines.join("\n");
    }
    if (typeof fm.aliases === "string") {
      fm.aliases = fm.aliases.replace(/^\[/, "").replace(/\]$/, "").split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    }
    return { raw: raw, fm: fm, body: body };
  }

  /* ---------- Fallback-Markdown-Renderer (falls CDN nicht lädt) ---------- */
  function fbInline(s) {
    // Wikilinks sind zu diesem Zeitpunkt schon HTML — nur Text außerhalb von Tags escapen
    return s.split(/(<[^>]+>)/).map(function (part) {
      if (/^<[^>]+>$/.test(part)) return part;
      part = escapeHtml(part);
      part = part.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      part = part.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      part = part.replace(/`([^`]+)`/g, "<code>$1</code>");
      return part;
    }).join("");
  }
  function fbMarkdown(md) {
    var lines = md.split("\n"), out = [], i = 0, m;
    while (i < lines.length) {
      var line = lines[i];
      if (!line.trim()) { i++; continue; }
      if ((m = line.match(/^(#{1,4})\s+(.*)$/))) { var l = m[1].length; out.push("<h" + l + ">" + fbInline(m[2]) + "</h" + l + ">"); i++; continue; }
      if (/^\s*[-*]\s/.test(line)) {
        out.push("<ul>");
        while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) { out.push("<li>" + fbInline(lines[i].replace(/^\s*[-*]\s/, "")) + "</li>"); i++; }
        out.push("</ul>"); continue;
      }
      if (/^>/.test(line)) {
        out.push("<blockquote><p>");
        var q = [];
        while (i < lines.length && /^>/.test(lines[i])) { q.push(fbInline(lines[i].replace(/^>\s?/, ""))); i++; }
        out.push(q.join(" ") + "</p></blockquote>"); continue;
      }
      var para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*]\s|>)/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + fbInline(para.join(" ")) + "</p>");
    }
    return out.join("\n");
  }

  /* ---------- Wikilinks ---------- */
  function resolveName(name) { return nameIndex[String(name).trim().toLowerCase()] || null; }
  function wikilinkHtml(target, label, cls) {
    label = (label || target).trim();
    var entry = resolveName(target);
    if (entry) return '<a' + (cls ? ' class="' + cls + '"' : "") + ' href="#/' + encodePath(entry.path) + '">' + escapeHtml(label) + "</a>";
    return '<span class="wikilink-missing' + (cls ? " " + cls : "") + '" title="Keine eigene Seite">' + escapeHtml(label) + "</span>";
  }
  function replaceWikilinks(md) {
    return md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function (w, t, l) { return wikilinkHtml(t, l); });
  }

  function transformCallouts(root) {
    root.querySelectorAll("blockquote").forEach(function (q) {
      var first = q.firstElementChild;
      if (!first) return;
      var m = (first.textContent || "").match(/^\[!(\w+)\]\s*(.*)$/);
      if (!m) return;
      var div = document.createElement("div");
      div.className = "callout callout-" + m[1].toLowerCase();
      var head = document.createElement("div");
      head.className = "callout-title";
      head.innerHTML = ICONS.warn + "<span>" + escapeHtml(m[2]) + "</span>";
      first.remove();
      div.appendChild(head);
      while (q.firstChild) div.appendChild(q.firstChild);
      q.replaceWith(div);
    });
  }
  // [sic]-Vermerke bleiben erhalten, treten aber optisch zurück
  function softenSic(html) { return html.replace(/\[sic\]/g, '<span class="sic" title="wörtlich aus der Chronik">[sic]</span>'); }

  function mdToHtml(md) {
    var html;
    if (window.marked && marked.parse) { try { html = marked.parse(md); } catch (e) { html = fbMarkdown(md); } }
    else html = fbMarkdown(md);
    var tpl = document.createElement("template");
    tpl.innerHTML = softenSic(html);
    transformCallouts(tpl.content);
    return tpl.innerHTML;
  }

  /* ---------- Manifest ---------- */
  function loadManifest() {
    return fetch(MANIFEST_URL).then(function (r) {
      if (!r.ok) throw new Error("manifest.json nicht erreichbar (" + r.status + ")");
      return r.json();
    }).then(function (data) {
      manifest = data;
      // Erst Aliase, dann Seitennamen: ein echter Seitenname gewinnt immer gegen einen gleichlautenden Alias
      manifest.pages.forEach(function (p) {
        p.aliases = p.aliases || [];
        pathIndex[p.path] = p;
        p.aliases.forEach(function (a) { var k = a.toLowerCase(); if (!nameIndex[k]) nameIndex[k] = p; });
      });
      manifest.pages.forEach(function (p) { nameIndex[basename(p.path).toLowerCase()] = p; });
            buildSidebar();
    });
  }

  function isLost(p) { return /^(tot|gestorben|gefallen|vergangen|verging|verschollen)/i.test(p.status || ""); }
  function sortPages(arr) {
    return arr.sort(function (a, b) { return (b.w || 0) - (a.w || 0) || a.title.localeCompare(b.title, "de"); });
  }

  /* ---------- Sidebar ---------- */
  function navLink(p, iconKey, label) {
    var a = document.createElement("a");
    a.className = "navitem";
    a.href = p ? "#/" + encodePath(p.path) : ATLAS_URL;
    if (p) a.dataset.path = p.path;
    a.innerHTML = (ICONS[iconKey] || "") + "<span>" + escapeHtml(label || p.title) + "</span>" + (p && p.held && isLost(p) ? '<span class="lost" title="' + escapeHtml(p.status) + '"></span>' : "");
    a.addEventListener("click", function () { document.body.classList.remove("nav-open"); });
    return a;
  }
  function buildSidebar() {
    var pages = manifest.pages.slice();
    var top = document.createElement("div");
    top.className = "nav-top";
    if (pathIndex["index"]) top.appendChild(navLink(pathIndex["index"], "uebersicht", "Übersicht"));
    if (pathIndex["Timeline"]) top.appendChild(navLink(pathIndex["Timeline"], "timeline", "Timeline"));
    top.appendChild(navLink(null, "atlas", "Reiseatlas"));
    navEl.appendChild(top);

    var openState = store("navOpen") || { held: true };
    var order = ["held", "person", "ort", "artefakt", "fraktion", "kreatur", "tier"];
    order.forEach(function (key) {
      var items = key === "held" ? pages.filter(function (p) { return p.held; }) : pages.filter(function (p) { return p.type === key && !p.held; });
      if (!items.length) return;
      sortPages(items);
      var det = document.createElement("details");
      det.className = "navgroup";
      det.open = !!openState[key];
      det.addEventListener("toggle", function () { openState[key] = det.open; store("navOpen", openState); });
      var sum = document.createElement("summary");
      sum.innerHTML = ICONS.chev + "<span>" + GROUP_LABELS[key] + '</span><span class="count">' + items.length + "</span>";
      det.appendChild(sum);
      var ul = document.createElement("ul");
      items.forEach(function (p) { var li = document.createElement("li"); li.appendChild(navLink(p, key === "held" ? "held" : p.type)); ul.appendChild(li); });
      det.appendChild(ul);
      navEl.appendChild(det);
    });
    var fs = pages.filter(function (p) { return p.type === "fortschritt"; });
    if (fs.length) {
      var foot = document.createElement("div");
      foot.className = "nav-top";
      foot.style.borderBottom = "0"; foot.style.borderTop = "1px solid var(--line-soft)"; foot.style.marginTop = "12px"; foot.style.paddingTop = "8px";
      fs.forEach(function (p) { foot.appendChild(navLink(p, "fortschritt", "Arbeitsvermerk")); });
      navEl.appendChild(foot);
    }
  }
  function markActive(path) {
    var activeEl = null;
    navEl.querySelectorAll(".navitem").forEach(function (a) {
      var on = a.dataset.path === path;
      a.classList.toggle("active", on);
      if (on) { activeEl = a; a.setAttribute("aria-current", "page"); } else a.removeAttribute("aria-current");
    });
    if (activeEl) {
      var grp = activeEl.closest("details");
      if (grp && !grp.open) grp.open = true;
      var r = activeEl.getBoundingClientRect(), nr = navEl.getBoundingClientRect();
      if (r.top < nr.top || r.bottom > nr.bottom) activeEl.scrollIntoView({ block: "center" });
    }
  }

  /* ---------- Seiten laden ---------- */
  function fetchPage(path) {
    if (pageCache[path]) return Promise.resolve(pageCache[path]);
    return fetch("content/" + encodePath(path) + ".md").then(function (r) {
      if (!r.ok) throw new Error("Seite nicht gefunden (" + r.status + ")");
      return r.text();
    }).then(function (raw) { return (pageCache[path] = parseFrontmatter(raw)); });
  }

  function statusClass(s) {
    if (!s) return "";
    s = s.toLowerCase();
    if (/^(tot|gestorben|gefallen|zerstört|vergangen)|verging/.test(s)) return "bad";
    if (/^(lebendig|bei der gruppe|aktiv|gesund|bestehend|in sicherheit)/.test(s)) return "ok";
    if (/unbekannt|verschollen|verschwunden|verlassen|verloren|überfallen|beschädigt|offen/.test(s)) return "warn";
    return "";
  }
  function stripLeadingH1(body) { return body.replace(/^\s*#\s+[^\n]*\n+/, ""); }

  function renderHeader(entry, fm) {
    var title = fm.title || entry.title || basename(entry.path);
    var k = typeKey(entry);
    var html = '<header class="page-head">';
    html += '<span class="crumb">' + (ICONS[k] || "") + escapeHtml(TYPE_LABELS[k] || "Eintrag") + "</span>";
    html += '<h1 class="page-title">' + escapeHtml(title) + "</h1>";
    if (fm.kurz) html += '<p class="kurz">' + mdInline(fm.kurz) + "</p>";
    return html + "</header>";
  }
  function mdInline(s) { return softenSic(replaceWikilinks(escapeHtml(s).replace(/&quot;/g, '"'))); }

  function renderSteckbrief(entry, fm, headings) {
    var blocks = "";
    var info = "";
    if (fm.status) info += '<p class="sb-label">Stand</p><div class="sb-row sb-status"><span class="dot ' + statusClass(fm.status) + '"></span><span>' + mdInline(fm.status) + "</span></div>";
    if (fm.aliases && fm.aliases.length) info += '<p class="sb-label">Auch genannt</p><div class="sb-row sb-alias">' + fm.aliases.map(escapeHtml).join(", ") + "</div>";
    if (info) blocks += '<div class="sb-block">' + info + "</div>";
    if (headings.length >= 2) {
      blocks += '<div class="sb-block sb-toc"><p class="sb-label">Auf dieser Seite</p><ul class="toc">' +
        headings.map(function (h) { return '<li><a href="#' + h.id + '" data-toc="' + h.id + '">' + h.text + "</a></li>"; }).join("") + "</ul></div>";
    }
    return blocks ? '<aside class="steckbrief" aria-label="Steckbrief">' + blocks + "</aside>" : "";
  }

  function extractLinks(value, cls) {
    var out = [], re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, m;
    while ((m = re.exec(value)) !== null) out.push(wikilinkHtml(m[1], m[2], cls));
    return out;
  }
  function plainNames(value) {
    var out = [], re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, m;
    while ((m = re.exec(value)) !== null) out.push((m[2] || m[1]).trim());
    return out;
  }

  /* ---------- Übersicht ---------- */
  var MOON_SVG =
    '<svg class="hero-moon" viewBox="0 0 300 300" aria-hidden="true">' +
    '<defs><radialGradient id="mg" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#eef2fa"/><stop offset=".7" stop-color="#c3cbdd"/><stop offset="1" stop-color="#8d96ad"/></radialGradient>' +
    '<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#7fd1c7" stop-opacity=".18"/><stop offset="1" stop-color="#7fd1c7" stop-opacity="0"/></radialGradient></defs>' +
    '<circle cx="150" cy="150" r="146" fill="url(#glow)"/>' +
    '<path d="M150 50a100 100 0 0 0 0 200l-12-58 26-40-22-44z" fill="url(#mg)"/>' +
    '<path d="M159 52l24 46-28 41 18 55-14 55a100 100 0 0 0 0-197z" fill="url(#mg)" opacity=".93"/>' +
    '<circle cx="118" cy="110" r="12" fill="#a9b2c6" opacity=".5"/><circle cx="96" cy="176" r="18" fill="#a9b2c6" opacity=".35"/><circle cx="200" cy="168" r="10" fill="#a9b2c6" opacity=".45"/>' +
    '<path d="M150 50l14 48-26 40 12 58-4 54" fill="none" stroke="#7fd1c7" stroke-width="2.5" opacity=".9"/>' +
    '<g class="shard drift"><path d="M232 46l20 6-6 18-18-8z" fill="#7fd1c7"/></g>' +
    '<g class="shard drift d2"><path d="M258 96l12 2-2 12-12-4z" fill="#d5dceb" opacity=".8"/></g>' +
    '<g class="shard drift d3"><path d="M214 24l8 1-1 8-8-2z" fill="#7fd1c7" opacity=".6"/></g>' +
    "</svg>";

  function renderOverview(entry, data) {
    var body = stripLeadingH1(data.body);
    // Einleitungssatz = erster Absatz vor dem ersten ##
    var parts = body.split(/\n(?=## )/);
    var lead = parts[0].trim();
    var rest = parts.slice(1);
    var heroes = sortPages(manifest.pages.filter(function (p) { return p.held; }));
    heroes.sort(function (a, b) { return (isLost(a) ? 1 : 0) - (isLost(b) ? 1 : 0); });

    var html = '<section class="hero"><div><h1>Die Chronik</h1>';
    if (lead) html += '<p class="hero-lead">' + mdInline(lead.replace(/\s*Die Prosa bleibt in der Chronik; hier stehen die Kernfakten\.?/, "")) + "</p>";
    if (manifest.coverage) html += '<div class="hero-stand"><span class="dot"></span>' + escapeHtml(manifest.coverage) + "</div>";
    html += "</div>" + MOON_SVG + "</section>";

    html += '<h2 class="section-title">Die Gruppe</h2><div class="heroes">';
    heroes.forEach(function (p) {
      var lost = isLost(p);
      html += '<a class="hero-card' + (lost ? " fallen" : "") + '" href="#/' + encodePath(p.path) + '">' +
        '<span class="hc-name">' + escapeHtml(p.title) + "</span>" +
        '<span class="hc-kurz">' + escapeHtml(p.kurz || "") + "</span>" +
        '<span class="hc-state"><span class="dot ' + statusClass(p.status) + '"></span>' + escapeHtml((p.status || "").split(/[;(—]/)[0].trim()) + "</span></a>";
    });
    html += "</div>";

    // Status quo als Lesetext, die langen Verzeichnislisten fliegen raus (stehen in der Navigation)
    var keep = rest.filter(function (s) { return !/^## (Helden|Personen|Orte|Artefakte|Tiere|Fraktionen|Kreaturen)\s*$/m.test(s.split("\n")[0]); });
    var lists = rest.filter(function (s) { return keep.indexOf(s) < 0 && !/^## Helden/.test(s); });

    html += '<div class="ov-grid"><div class="article">' + mdToHtml(replaceWikilinks(keep.join("\n"))) + "</div>";
    html += '<aside class="ov-side"><h2 class="section-title" style="font-size:21px">Nachschlagen</h2><div class="quick">';
    html += '<a href="#/Timeline">' + ICONS.timeline + '<span>Timeline<small>Alle Sessions, filterbar nach Ort und Person</small></span></a>';
    html += '<a href="' + ATLAS_URL + '">' + ICONS.atlas + '<span>Reiseatlas<small>Die Route der Gruppe auf der Karte</small></span></a>';
    lists.forEach(function (s) {
      var label = s.split("\n")[0].replace(/^##\s*/, "").trim();
      var key = Object.keys(GROUP_LABELS).filter(function (k) { return GROUP_LABELS[k] === label; })[0];
      var n = key ? manifest.pages.filter(function (p) { return p.type === key && !p.held; }).length : (s.match(/\[\[/g) || []).length;
      html += '<a href="#/' + (key ? "_gruppe/" + key : "") + '">' + (ICONS[key] || "") + "<span>" + escapeHtml(label) + "<small>" + n + " Einträge</small></span></a>";
    });
    html += "</div></aside></div>";
    return html;
  }

  /* Gruppenseite (Personen, Orte, …) als sortierte Liste */
  function renderGroup(key) {
    var items = sortPages(manifest.pages.filter(function (p) { return key === "held" ? p.held : (p.type === key && !p.held); }));
    var html = '<header class="page-head"><span class="crumb">' + (ICONS[key] || "") + "Verzeichnis</span><h1 class=\"page-title\">" + escapeHtml(GROUP_LABELS[key]) + "</h1>" +
      '<p class="kurz">' + items.length + " Einträge, die wichtigsten zuerst.</p></header>";
    html += '<div class="article"><ul>';
    items.forEach(function (p) {
      html += '<li><a href="#/' + encodePath(p.path) + '"><strong>' + escapeHtml(p.title) + "</strong></a>" + (p.kurz ? " — " + escapeHtml(p.kurz) : "") + "</li>";
    });
    return html + "</ul></div>";
  }

  /* ---------- Timeline ---------- */
  function renderTimeline(body) {
    var lines = body.split("\n"), sessions = [], intro = [], cur = null;
    lines.forEach(function (line) {
      var hm = line.match(/^##\s+Session\s+(\d+)\s*(?:[-–—]\s*(.*))?$/);
      if (hm) { cur = { num: hm[1], title: (hm[2] || "").trim() || "(ohne Titel in der Chronik)", datum: "", ortRaw: "", betRaw: "", ereignis: [], quelle: "" }; sessions.push(cur); return; }
      if (cur) {
        var m;
        if ((m = line.match(/^- Datum(?: \(in-world\))?:\s*(.*)$/))) cur.datum = m[1];
        else if ((m = line.match(/^- Orte:\s*(.*)$/))) cur.ortRaw = m[1];
        else if ((m = line.match(/^- Beteiligte:\s*(.*)$/))) cur.betRaw = m[1];
        else if ((m = line.match(/^- Ereignis:\s*(.*)$/))) cur.ereignis.push(m[1]);
        else if ((m = line.match(/^- Quelle:\s*(.*)$/))) cur.quelle += m[1];
        else if (line.trim() && cur.ereignis.length && !/^- /.test(line)) cur.ereignis.push(line.trim());
      } else if (!/^#\s/.test(line) && line.trim() && !/^Format-Hinweis/.test(line)) intro.push(line);
    });
    if (!sessions.length) return mdToHtml(replaceWikilinks(stripLeadingH1(body)));

    var html = "";
    html += '<div class="tl-tools"><label class="sr-only" for="tl-filter">Sessions filtern</label>' +
      '<input id="tl-filter" class="tl-filter" type="search" placeholder="Filtern: Ort, Person, Nummer" autocomplete="off">' +
      '<button class="tl-btn" data-tl="open" type="button">Alle aufklappen</button><button class="tl-btn" data-tl="close" type="button">Alle zuklappen</button>' +
      '<span class="tl-count" id="tl-count">' + sessions.length + " Sessions</span></div>";
    if (intro.length) html += '<p class="timeline-intro">' + softenSic(escapeHtml(intro.join(" "))) + "</p>";
    html += '<div class="tl" id="tl">';
    sessions.slice().reverse().forEach(function (s, idx) {
      var places = plainNames(s.ortRaw);
      var hay = [s.num, s.title, s.datum, s.ortRaw, s.betRaw, s.ereignis.join(" ")].join(" ").replace(/\[\[|\]\]/g, "").toLowerCase();
      html += '<details class="session-card' + (idx === 0 ? " latest" : "") + '" id="session-' + s.num + '" data-hay="' + escapeHtml(hay) + '"' + (idx === 0 ? " open" : "") + ">";
      html += '<summary><span class="session-num" aria-label="Session ' + s.num + '">' + parseInt(s.num, 10) + "</span>";
      html += '<h3 class="session-title">' + softenSic(escapeHtml(s.title)) + "</h3>";
      html += '<span class="session-date">' + escapeHtml(s.datum || "") + "</span>";
      if (places.length) html += '<span class="session-places">' + places.map(escapeHtml).join(", ") + "</span>";
      html += "</summary><div class=\"session-body\">";
      if (s.ereignis.length) html += '<div class="session-event">' + mdToHtml(replaceWikilinks(s.ereignis.join(" "))) + "</div>";
      var row = function (label, raw) {
        var arr = extractLinks(raw, "chip");
        return arr.length ? '<div class="chip-row"><span class="chip-label">' + label + "</span>" + arr.join("") + "</div>" : "";
      };
      html += row("Orte", s.ortRaw) + row("Beteiligt", s.betRaw);
      if (s.quelle) html += '<div class="session-source">Quelle: ' + softenSic(escapeHtml(s.quelle)) + "</div>";
      html += "</div></details>";
    });
    html += '</div><p class="tl-empty" id="tl-empty" hidden>Keine Session passt zu diesem Filter.</p>';
    return html;
  }
  function wireTimeline() {
    var input = document.getElementById("tl-filter");
    if (!input) return;
    var cards = Array.prototype.slice.call(contentEl.querySelectorAll(".session-card"));
    var countEl = document.getElementById("tl-count"), emptyEl = document.getElementById("tl-empty");
    input.addEventListener("input", function () {
      var q = input.value.trim().toLowerCase(), n = 0;
      cards.forEach(function (c) {
        var hit = !q || c.dataset.hay.indexOf(q) >= 0 || ("session " + parseInt(c.id.replace("session-", ""), 10)) === q || c.id.replace("session-", "").replace(/^0+/, "") === q.replace(/^0+/, "");
        c.hidden = !hit; if (hit) n++;
      });
      countEl.textContent = q ? n + " von " + cards.length + " Sessions" : cards.length + " Sessions";
      emptyEl.hidden = n > 0;
    });
  }

  /* ---------- Backlinks ---------- */
  function renderBacklinks(entry) {
    if (!searchReady) return "";
    var names = [basename(entry.path)].concat(entry.aliases || []);
    var re = new RegExp("\\[\\[\\s*(?:" + names.map(function (n) { return n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|") + ")\\s*(?:\\||\\]\\])", "i");
    var hits = [];
    Object.keys(pageCache).forEach(function (p) {
      if (p === entry.path || p === "index" || p === "_Fortschritt") return;
      if (re.test(pageCache[p].raw)) hits.push(pathIndex[p]);
    });
    if (!hits.length) return "";
    sortPages(hits);
    return '<section class="backlinks"><h2>Erwähnt in ' + hits.length + (hits.length === 1 ? " Eintrag" : " Einträgen") + '</h2><div class="chip-row">' +
      hits.map(function (h) { return '<a class="chip" href="#/' + encodePath(h.path) + '">' + escapeHtml(h.title) + "</a>"; }).join("") + "</div></section>";
  }

  function decorateLists(root) {
    root.querySelectorAll("p").forEach(function (p) {
      var links = p.querySelectorAll("a, .wikilink-missing");
      if (links.length >= 4 && (p.textContent.match(/·/g) || []).length >= 3) {
        p.classList.add("link-cloud");
        p.innerHTML = p.innerHTML.replace(/\s*·\s*/g, " ");
      }
    });
  }


  // Abschnitt „Steckbrief“ (h2) mit h3-Unterfeldern als Kartenraster darstellen
  function decorateSteckbrief(root) {
    var h2 = Array.prototype.filter.call(root.querySelectorAll(".article h2"), function (h) { return h.textContent.trim() === "Steckbrief"; })[0];
    if (!h2) return;
    var grid = document.createElement("div");
    grid.className = "sb-grid";
    var card = null, node = h2.nextElementSibling;
    while (node && node.tagName !== "H2") {
      var next = node.nextElementSibling;
      if (node.tagName === "H3") { card = document.createElement("div"); card.className = "sb-card"; grid.appendChild(card); }
      if (card) card.appendChild(node);
      node = next;
    }
    if (!grid.children.length) return;
    h2.insertAdjacentElement("afterend", grid);
  }

  function collectHeadings(root) {
    var out = [];
    root.querySelectorAll(".article h2").forEach(function (h) {
      var id = slug(h.textContent);
      while (document.getElementById(id) || out.some(function (o) { return o.id === id; })) id += "-x";
      h.id = id;
      out.push({ id: id, text: escapeHtml(h.textContent.replace(/^Sessions?\s+/, "")) });
    });
    return out;
  }
  function watchToc() {
    if (tocObserver) tocObserver.disconnect();
    var links = contentEl.querySelectorAll("[data-toc]");
    if (!links.length || !("IntersectionObserver" in window)) return;
    tocObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        links.forEach(function (l) { l.classList.toggle("on", l.dataset.toc === e.target.id); });
      });
    }, { rootMargin: "0px 0px -70% 0px" });
    links.forEach(function (l) { var t = document.getElementById(l.dataset.toc); if (t) tocObserver.observe(t); });
  }

  /* ---------- Router ---------- */
  function route() {
    var raw = location.hash.replace(/^#\/?/, "");
    // In-Page-Anker (Inhaltsverzeichnis) nicht als Seitenwechsel behandeln
    if (raw && location.hash.indexOf("#/") !== 0) {
      var target = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (target) { target.scrollIntoView(); return; }
    }
    var path = raw ? raw.split("/").map(decodeURIComponent).join("/") : "index";

    var gm = path.match(/^_gruppe\/(\w+)$/);
    if (gm && GROUP_LABELS[gm[1]]) {
      contentEl.innerHTML = renderGroup(gm[1]);
      markActive(null); document.title = GROUP_LABELS[gm[1]] + " · Chronik-Wiki"; window.scrollTo(0, 0);
      return;
    }

    var entry = pathIndex[path] || resolveName(path);
    markActive(entry ? entry.path : null);
    if (!entry) {
      contentEl.innerHTML = '<div class="error-card"><h2>Kein Eintrag „' + escapeHtml(path) + '“</h2><p>Die Seite gibt es (noch) nicht. Probier die Suche links oder geh zur <a href="#/">Übersicht</a>.</p></div>';
      document.title = "Nicht gefunden · Chronik-Wiki";
      return;
    }
    if (!pageCache[entry.path]) contentEl.innerHTML = '<div class="loading">Die Chronik wird aufgeschlagen …</div>';

    fetchPage(entry.path).then(function (data) {
      currentEntry = entry;
      var fm = data.fm || {};
      var html;
      if (entry.type === "uebersicht") {
        html = renderOverview(entry, data);
      } else if (entry.type === "timeline") {
        html = renderHeader(entry, { title: "Timeline", kurz: "Jede Session in Kurzform, die neueste oben." }) + renderTimeline(data.body);
      } else {
        var article = mdToHtml(replaceWikilinks(stripLeadingH1(data.body)));
        html = renderHeader(entry, fm) + '<div class="page-grid"><div class="article">' + article + '</div><!--SB--></div>';
        html += '<div id="bl-slot">' + renderBacklinks(entry) + "</div>";
        html += '<p class="page-footer">Destillat der Chronik. Zitate stehen wörtlich, auch mit Schreibfehlern; die ausführliche Prosa bleibt im Original.</p>';
      }
      contentEl.innerHTML = html;
      if (entry.type !== "uebersicht" && entry.type !== "timeline") {
        decorateSteckbrief(contentEl);
        var heads = collectHeadings(contentEl);
        var sb = renderSteckbrief(entry, fm, heads);
        var grid = contentEl.querySelector(".page-grid");
        if (sb) grid.insertAdjacentHTML("beforeend", sb); else grid.classList.add("solo");
        watchToc();
      }
      decorateLists(contentEl);
      if (entry.type === "timeline") wireTimeline();
      document.title = (entry.type === "uebersicht" ? "Chronik-Wiki" : (fm.title || entry.title) + " · Chronik-Wiki");
      window.scrollTo(0, 0);
      ensureSearchIndex();
    }).catch(function (err) {
      contentEl.innerHTML = '<div class="error-card"><h2>Seite konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p></div>";
    });
  }

  /* ---------- Suchindex ---------- */
  function ensureSearchIndex() {
    if (searchReady || searchKicking) return;
    searchKicking = true;
    var paths = manifest.pages.map(function (p) { return p.path; });
    var queue = paths.slice();
    function worker() {
      if (!queue.length) {
        if (!searchReady && paths.every(function (p) { return pageCache[p]; })) {
          searchReady = true; searchKicking = false;
          var slot = document.getElementById("bl-slot");
          if (currentEntry && slot && !slot.innerHTML) slot.innerHTML = renderBacklinks(currentEntry);
          if (searchInput.value.trim()) runSearch();
        }
        return;
      }
      fetchPage(queue.shift()).then(worker, worker);
    }
    for (var i = 0; i < 8; i++) worker();
    // falls einzelne Seiten fehlschlagen: nach kurzer Zeit trotzdem freigeben
    setTimeout(function () { if (!searchReady) { searchReady = true; searchKicking = false; } }, 15000);
  }

  /* ---------- Suche ---------- */
  var searchTimer = null, sel = -1;
  searchInput.addEventListener("input", function () { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 120); });
  searchInput.addEventListener("focus", function () { if (searchInput.value.trim()) runSearch(); ensureSearchIndex(); });
  searchInput.addEventListener("keydown", function (e) {
    var items = searchResults.querySelectorAll(".sr-item");
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!items.length) return;
      e.preventDefault();
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items.forEach(function (it, i) { it.classList.toggle("sel", i === sel); });
      items[sel].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      var pick = items[sel >= 0 ? sel : 0];
      if (pick) { location.hash = pick.getAttribute("href"); closeSearch(true); }
    } else if (e.key === "Escape") closeSearch(true);
  });
  function closeSearch(blur) {
    searchResults.classList.remove("open"); sel = -1;
    if (blur) { searchInput.blur(); document.body.classList.remove("nav-open"); }
  }
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".search-wrap")) closeSearch(false);
    if (e.target.closest(".sr-item")) { closeSearch(true); searchInput.value = ""; }
  });
  document.addEventListener("keydown", function (e) {
    var typing = /input|textarea/i.test((document.activeElement || {}).tagName || "");
    if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) {
      e.preventDefault();
      if (window.innerWidth <= 920) document.body.classList.add("nav-open");
      searchInput.focus(); searchInput.select();
    }
  });

  function snippet(text, q) {
    text = text.replace(/^#+\s*/gm, "").replace(/\*\*/g, "").replace(/\s+/g, " ");
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx < 0) return null;
    var start = Math.max(0, idx - 50), end = Math.min(text.length, idx + q.length + 70);
    var s = (start > 0 ? "… " : "") + text.slice(start, end).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2").replace(/\[\[|\]\]/g, "") + (end < text.length ? " …" : "");
    var re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return escapeHtml(s).replace(re, "<mark>$1</mark>");
  }

  function runSearch() {
    var q = searchInput.value.trim();
    sel = -1;
    if (!q) { closeSearch(false); searchResults.innerHTML = ""; return; }
    var ql = q.toLowerCase(), results = [];
    manifest.pages.forEach(function (p) {
      if (p.type === "fortschritt") return;
      var score = 0, t = p.title.toLowerCase();
      if (t.startsWith(ql)) score = 12;
      else if (t.indexOf(ql) >= 0) score = 9;
      else if ((p.aliases || []).some(function (a) { return a.toLowerCase().indexOf(ql) >= 0; })) score = 6;
      else if ((p.kurz || "").toLowerCase().indexOf(ql) >= 0) score = 5;
      var data = pageCache[p.path];
      if (!score && data && data.raw.toLowerCase().indexOf(ql) >= 0) score = 3;
      if (score) results.push({ p: p, score: score + Math.min(4, (p.w || 0) / 25) });
    });
    results.sort(function (a, b) { return b.score - a.score || a.p.title.localeCompare(b.p.title, "de"); });
    results = results.slice(0, 12);
    var html = results.map(function (r) {
      var d = pageCache[r.p.path];
      var s = d ? snippet(d.body, q) : null;
      if (!s && r.p.kurz) s = escapeHtml(r.p.kurz);
      return '<a class="sr-item" role="option" href="#/' + encodePath(r.p.path) + '"><div class="sr-title">' + (ICONS[typeKey(r.p)] || "") +
        "<span>" + escapeHtml(r.p.title) + '</span><span class="sr-type">' + (TYPE_LABELS[typeKey(r.p)] || "") + "</span></div>" +
        (s ? '<div class="sr-snippet">' + s + "</div>" : "") + "</a>";
    }).join("");
    if (!searchReady) html += '<div class="sr-empty">Volltext wird noch geladen; Namen werden schon gefunden.</div>';
    else if (!results.length) html = '<div class="sr-empty">Kein Treffer für „' + escapeHtml(q) + '“. Die Chronik schreibt Namen oft verschieden; probier einen Wortteil.</div>';
    searchResults.innerHTML = html;
    searchResults.classList.add("open");
  }

  /* ---------- Navigation ---------- */
  window.addEventListener("hashchange", route);
  document.getElementById("menu-toggle").addEventListener("click", function () { document.body.classList.toggle("nav-open"); });
  document.getElementById("nav-backdrop").addEventListener("click", function () { document.body.classList.remove("nav-open"); });
  contentEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".tl-btn");
    if (btn) {
      var open = btn.dataset.tl === "open";
      contentEl.querySelectorAll("details.session-card:not([hidden])").forEach(function (d) { d.open = open; });
      return;
    }
    var toc = e.target.closest("[data-toc]");
    if (toc) {
      e.preventDefault();
      var t = document.getElementById(toc.dataset.toc);
      if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
  });

  loadManifest().then(route).catch(function (err) {
    contentEl.innerHTML = '<div class="error-card"><h2>Chronik konnte nicht geladen werden</h2><p>' + escapeHtml(err.message) + "</p><p>Prüfe, ob GitHub Pages aktiviert ist (Settings → Pages → Branch: main, Ordner: /).</p></div>";
  });
})();
</script>
</body>
</html>
